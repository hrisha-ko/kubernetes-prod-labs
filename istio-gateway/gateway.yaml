apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
---
# Istio sees gatewayClassName: istio and creates a Deployment and a Service
# named ingress-istio in this namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      # The only address in MetalLB's default-pool
      metallb.io/loadBalancerIPs: 192.168.80.254
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All        # HTTPRoutes from any namespace may attach
