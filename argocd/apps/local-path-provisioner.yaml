apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  annotations:
    # Storage first: kube-prometheus-stack needs the StorageClass
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # The chart is not published to a Helm repository, only kept in git
    repoURL: https://github.com/rancher/local-path-provisioner.git
    targetRevision: v0.0.37
    path: deploy/chart/local-path-provisioner
    helm:
      releaseName: local-path-provisioner
      valuesObject:
        storageClass:
          name: local-path
          defaultClass: true     # PVCs without storageClassName use it
        helperImage:
          tag: "1.36"            # busybox; the chart default is "latest"
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
